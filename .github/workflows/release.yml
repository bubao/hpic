name: Release & Multi-Platform Packaging

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==============================================================================
  # 0. 自动化测试防线 Job (Go 静态检查 + 竞态检测 + 前端构建 / Vitest 单元测试)
  # ==============================================================================
  test:
    name: Run Static Checks, Test Suite & Race Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # 与仓库 go.mod 保持同步，避免本地与 CI 的 Go 工具链版本漂移导致构建失败
          go-version-file: 'go.mod'
          check-latest: true
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Build Frontend & Run Frontend Tests
        run: |
          cd frontend
          npm ci || npm install
          npm run build
          npm test

      - name: Run Go Static Analysis (go vet)
        run: go vet ./...

      - name: Check Go Formatting (gofmt)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "[ERROR] 以下 Go 文件未通过 gofmt 格式化："
            echo "$unformatted"
            exit 1
          fi
          echo "[OK] 所有 Go 文件均符合 gofmt 规范"

      - name: Run Backend Tests with Race Detector
        run: go test -race -v ./...

  # ==============================================================================
  # 1. macOS 打包 Job (dmgbuild 方案，稳定构造DS_Store，无appdmg)
  # ==============================================================================
  build-mac:
    name: Build macOS (DMG & Tar.gz)
    needs: [test]
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # 与仓库 go.mod 保持同步，避免本地与 CI 的 Go 工具链版本漂移导致构建失败
          go-version-file: 'go.mod'
          check-latest: true
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Build Clean Frontend
        run: |
          cd frontend
          npm ci || npm install
          npm run build

      - name: Generate Application Icons & DMG Background
        run: |
          node scripts/build-icons.mjs
          node scripts/generate-dmg-bg.mjs
          test -s native_macos/AppIcon.icns || (echo "[ERROR] 缺失 native_macos/AppIcon.icns 图标产物" && exit 1)
          test -s assets/dmg-background.png || (echo "[ERROR] 缺失 assets/dmg-background.png 产物" && exit 1)

      # ========== 替换：安装 dmgbuild 依赖，不再装 appdmg ==========
      - name: Install dmgbuild python dependencies
        run: |
          python3 -m pip install --break-system-packages dmgbuild ds_store mac_alias || python3 -m pip install dmgbuild ds_store mac_alias

      - name: Clean old build artifacts
        run: |
          rm -rf dist .stage hpic.app
          mkdir -p dist

      - name: Build macOS Per-Arch DMGs & Tarballs
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          RAW_VER="${VERSION#v}"
          if [ -z "$RAW_VER" ] || [ "$RAW_VER" = "master" ] || [ "$RAW_VER" = "main" ]; then
            RAW_VER="0.0.1"
          fi
          GIT_COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "${{ github.sha }}")
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          LDFLAGS="-w -s -X main.Version=${RAW_VER} -X main.GitCommit=${GIT_COMMIT} -X main.BuildDate=${BUILD_DATE}"

          # 编译 Swift 启动器与 Go 二进制（注入版本号）
          make build

          # ========== 按架构拆分制作双份原生 DMG (arm64 / amd64) ==========
          # 单架构包约 6MB，较此前 lipo 通用二进制包 (~12MB) 下载体积减半
          # package-dmg.sh 内部会挂载校验每份 DMG 的 .DS_Store，此处再校验产物存在性
          LDFLAGS="$LDFLAGS" bash ./scripts/package-macos-arch-dmgs.sh "${RAW_VER}"
          for A in arm64 amd64; do
            test -s "dist/hpic-v${RAW_VER}-macOS-${A}.dmg" || (echo "[ERROR] 缺失 ${A} DMG 产物" && exit 1)
          done

          # 2. 编译 Apple Silicon (arm64) 独立二进制包
          mkdir -p .stage/hpic-darwin-arm64
          GOOS=darwin GOARCH=arm64 go build -ldflags="$LDFLAGS" -o .stage/hpic-darwin-arm64/hpic .
          cp install.sh .stage/hpic-darwin-arm64/
          if [ -f "native_macos/hpic-mac-ui" ]; then
            cp "native_macos/hpic-mac-ui" .stage/hpic-darwin-arm64/
          fi
          tar -czf "dist/hpic-v${RAW_VER}-darwin-arm64.tar.gz" -C .stage hpic-darwin-arm64

          # 3. 编译 Intel (amd64) 独立二进制包
          mkdir -p .stage/hpic-darwin-amd64
          GOOS=darwin GOARCH=amd64 go build -ldflags="$LDFLAGS" -o .stage/hpic-darwin-amd64/hpic .
          cp install.sh .stage/hpic-darwin-amd64/
          if [ -f "native_macos/hpic-mac-ui" ]; then
            cp "native_macos/hpic-mac-ui" .stage/hpic-darwin-amd64/
          fi
          tar -czf "dist/hpic-v${RAW_VER}-darwin-amd64.tar.gz" -C .stage hpic-darwin-amd64

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-macos
          path: dist/*
          retention-days: 1

  # ==============================================================================
  # 2. Linux 打包 Job (生成 Tar.gz 与 Debian .deb 安装包)
  # ==============================================================================
  build-linux:
    name: Build Linux (Tar.gz & Deb)
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # 与仓库 go.mod 保持同步，避免本地与 CI 的 Go 工具链版本漂移导致构建失败
          go-version-file: 'go.mod'
          check-latest: true
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Build Clean Frontend
        run: |
          cd frontend
          npm ci || npm install
          npm run build

      - name: Install SVG Conversion Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Generate Application Icons
        run: |
          node scripts/build-icons.mjs

      - name: Build Linux Artifacts & Deb Packages
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          RAW_VER="${VERSION#v}"
          GIT_COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "${{ github.sha }}")
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          LDFLAGS="-w -s -X main.Version=${RAW_VER} -X main.GitCommit=${GIT_COMMIT} -X main.BuildDate=${BUILD_DATE}"
          chmod +x scripts/build-deb.sh

          # 1. 编译 Linux amd64
          mkdir -p .stage/hpic-linux-amd64
          GOOS=linux GOARCH=amd64 go build -ldflags="$LDFLAGS" -o .stage/hpic-linux-amd64/hpic .
          cp install.sh .stage/hpic-linux-amd64/
          [ -f "assets/hpic.desktop" ] && cp assets/hpic.desktop .stage/hpic-linux-amd64/
          [ -f "assets/icon.png" ] && cp assets/icon.png .stage/hpic-linux-amd64/
          tar -czf "dist/hpic-v${RAW_VER}-linux-amd64.tar.gz" -C .stage hpic-linux-amd64
          bash scripts/build-deb.sh "amd64" ".stage/hpic-linux-amd64/hpic" "${RAW_VER}" "dist"

          # 2. 编译 Linux arm64
          mkdir -p .stage/hpic-linux-arm64
          GOOS=linux GOARCH=arm64 go build -ldflags="$LDFLAGS" -o .stage/hpic-linux-arm64/hpic .
          cp install.sh .stage/hpic-linux-arm64/
          [ -f "assets/hpic.desktop" ] && cp assets/hpic.desktop .stage/hpic-linux-arm64/
          [ -f "assets/icon.png" ] && cp assets/icon.png .stage/hpic-linux-arm64/
          tar -czf "dist/hpic-v${RAW_VER}-linux-arm64.tar.gz" -C .stage hpic-linux-arm64
          bash scripts/build-deb.sh "arm64" ".stage/hpic-linux-arm64/hpic" "${RAW_VER}" "dist"

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-linux
          path: dist/*
          retention-days: 1

  # ==============================================================================
  # 3. Windows 打包 Job (生成绿色 Zip 与 NSIS 单文件 Setup.exe)
  # ==============================================================================
  build-windows:
    name: Build Windows (Zip & Setup.exe)
    needs: [test]
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # 与仓库 go.mod 保持同步，避免本地与 CI 的 Go 工具链版本漂移导致构建失败
          go-version-file: 'go.mod'
          check-latest: true
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install NSIS Compiler & SVG Tools
        shell: pwsh
        run: |
          choco install nsis rsvg-convert -y --no-progress --timeout 300
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "C:\Program Files\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Generate Application Icons
        shell: pwsh
        run: |
          node scripts\build-icons.mjs

      - name: Build Clean Frontend
        shell: bash
        run: |
          cd frontend
          npm ci || npm install
          npm run build

      - name: Build Windows Binaries & Installers
        shell: pwsh
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          $RawVer = $env:VERSION.TrimStart('v')
          $GitCommit = try { (git rev-parse --short HEAD 2>$null).Trim() } catch { "dev" }
          $BuildDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $LdFlags = "-w -s -X main.Version=$RawVer -X main.GitCommit=$GitCommit -X main.BuildDate=$BuildDate"
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          New-Item -ItemType Directory -Path .stage\hpic-windows-amd64 -Force | Out-Null

          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -ldflags="$LdFlags" -o .stage\hpic-windows-amd64\hpic.exe .
          Copy-Item .stage\hpic-windows-amd64\hpic.exe .stage\hpic-windows-amd64\hpic-desktop.exe -Force
          Copy-Item install.ps1 .stage\hpic-windows-amd64\ -Force
          Copy-Item uninstall.ps1 .stage\hpic-windows-amd64\ -Force

          # 拷贝 Windows 图标到分发目录
          if (Test-Path assets\app.ico) { Copy-Item assets\app.ico .stage\hpic-windows-amd64\ -Force }

          $UninstallCmd = @"
          @echo off
          title hpic 卸载程序
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0uninstall.ps1"
          pause
          "@
          Set-Content -Path .stage\hpic-windows-amd64\uninstall.cmd -Value $UninstallCmd -Encoding ASCII

          # 打包 zip 便携安装包（排除内部副本 hpic-desktop.exe：字节与 hpic.exe 完全相同，
          # install.ps1 安装时会自行创建，无需随包分发，可省 ~5.5MB；
          # 同一目录下的 NSIS 安装向导仍保留该副本，不受影响）
          $RepoRoot = (Get-Location).Path
          $WinStage = Join-Path $RepoRoot "\.stage\hpic-windows-amd64"
          # 单独建临时目录并沿用同名子目录，保证 zip 内仍是 hpic-windows-amd64/ 结构
          $WinZipStage = Join-Path $RepoRoot "\.stage\zip\hpic-windows-amd64"
          if (Test-Path $WinZipStage) { Remove-Item $WinZipStage -Recurse -Force }
          Copy-Item $WinStage $WinZipStage -Recurse
          Remove-Item (Join-Path $WinZipStage "hpic-desktop.exe") -Force
          Compress-Archive -Path "$WinZipStage\*" -DestinationPath "dist\hpic-v$RawVer-windows-amd64.zip" -Force

          # 编译 NSIS 原生安装向导
          $makensisBin = "makensis"
          if (-not (Get-Command "makensis" -ErrorAction SilentlyContinue)) {
              if (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe") {
                  $makensisBin = "C:\Program Files (x86)\NSIS\makensis.exe"
              } elseif (Test-Path "C:\Program Files\NSIS\makensis.exe") {
                  $makensisBin = "C:\Program Files\NSIS\makensis.exe"
              }
          }
          $RepoRoot = (Get-Location).Path
          $StageDir = Join-Path $RepoRoot ".stage\hpic-windows-amd64"
          $OutExe = Join-Path $RepoRoot "dist\hpic-v$RawVer-setup-amd64.exe"
          $makensisArgs = @(
              "/DPRODUCT_VERSION=$RawVer",
              "/DSOURCE_DIR=$StageDir",
              "/DOUTPUT_EXE=$OutExe"
          )
          if (Test-Path "assets\app.ico") {
              $IcoAbs = (Resolve-Path "assets\app.ico").Path
              $makensisArgs += "/DICON_FILE=$IcoAbs"
          }
          & $makensisBin @makensisArgs scripts\installer.nsi

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-windows
          path: dist/*
          retention-days: 1

  # ==============================================================================
  # 4. 聚合分发 Job (聚合全平台产物、生成校验和并正式发布 GitHub Release)
  # ==============================================================================
  publish-release:
    name: Aggregate & Publish Release
    needs: [build-mac, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums & Changelog
        id: prep
        run: |
          cd release-assets
          rm -f checksums.txt
          sha256sum * > checksums.txt
          echo "SHA256 Checksums:"
          cat checksums.txt
          cd ..

          # 自动使用规范生成器分析 commit 生成专业分类的 release notes
          chmod +x scripts/generate-changelog.sh
          PREV_TAG=$(git describe --tags --abbrev=0 ${{ github.ref_name }}^ 2>/dev/null || echo "")
          NOTES=$(bash scripts/generate-changelog.sh "$PREV_TAG" "${{ github.ref_name }}")

          RAW_VER=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          echo "RAW_VER=${RAW_VER}" >> $GITHUB_ENV
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          echo "$NOTES" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: hpic ${{ github.ref_name }}
          fail_on_unmatched_files: true
          body: |
            ## hpic ${{ github.ref_name }} 正式发布

            Hexo 博客封面与文章配图管理工具。

            ### 多系统原生安装包推荐
            - **macOS (Apple Silicon / Intel)**: 按芯片下载 `hpic-v${{ env.RAW_VER }}-macOS-arm64.dmg`（Apple Silicon）或 `hpic-v${{ env.RAW_VER }}-macOS-amd64.dmg`（Intel）拖拽安装。
            - **Windows (x64)**: 下载 `hpic-v${{ env.RAW_VER }}-setup-amd64.exe` 一键单文件安装向导；或下载 `hpic-v${{ env.RAW_VER }}-windows-amd64.zip` 解压便携使用。
            - **Ubuntu / Debian (Linux)**: 下载 `hpic_${{ env.RAW_VER }}_amd64.deb`，通过 `sudo dpkg -i` 或 `sudo apt install ./hpic_*.deb` 安装。
            - **全平台绿色归档**: 亦可下载对应系统的 `.tar.gz` 纯净二进制包。

            ### 更新日志 (Changelog)
            ${{ env.CHANGELOG }}

            ---
            *完整 SHA256 校验清单已收录于 `checksums.txt`*
          files: release-assets/*
          draft: false
          prerelease: false
